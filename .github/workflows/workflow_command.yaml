name: Workflow commands

on:
  push:
    branches:
      - test_workflow_command

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo commands
        run: |
          echo "::notice title=Watch out::Test notice"
          echo "::warning title=Something abnormal::Test warning"
      - name: Echo 500 chars
        run: |
          echo "::notice title=500 chars msg::"
      - name: Echo line break
        run: |
          echo "::warning title=with line break::abc\ndef\nghi"
          cat <<EOF
          ::warning
          ::Test multiple line
          messages
          EOF
  test-error:
    runs-on: ubuntu-latest
    steps:
      - name: Echo error
        run: |
          echo "::error ::Test error"
